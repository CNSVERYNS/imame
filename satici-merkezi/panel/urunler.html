<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ürünlerim — TesbihYol Satıcı Merkezi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d09">
<link rel="manifest" href="../../assets/manifest.json">
<link rel="apple-touch-icon" href="../../assets/img/logo-mark.png">
<link rel="icon" href="../../assets/img/logo-mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/panel.css">
</head>
<body class="panel-body">

<div class="panel-shell">
  <aside class="panel-sidebar">
    <a href="/satici-merkezi/panel" class="panel-brand">
      <img src="../../assets/img/logo-wordmark.png" alt="TesbihYol" class="brand-wordmark"><small>Satıcı Merkezi</small>
    </a>
    <nav class="panel-nav">
      <div class="panel-nav-label">Genel</div>
      <a href="/satici-merkezi/panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg> Panelim</a>
      <div class="panel-nav-label">Mağaza</div>
      <a href="/satici-merkezi/panel/urunler" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg> Ürünlerim</a>
      <a href="/satici-merkezi/panel/urun-ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg> Yeni Ürün Ekle</a>
      <a href="/satici-merkezi/panel/siparisler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h11v8H3z"/><path d="M14 11h4l3 3v1h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></svg> Siparişler</a>
      <a href="/satici-merkezi/panel/kazanc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M16 12h2"/></svg> Kazançlarım</a>
    </nav>
    <div class="panel-sidebar-foot">
      <div class="seller-mini">
        <div class="avatar">A.</div>
        <div><span>Konya El Sanatları</span><small>Ahmet Yılmaz</small></div>
      </div>
      <a href="/" class="btn btn-ghost btn-sm btn-block" style="margin-top:14px;">Mağazaya Dön</a>
      <a href="/satici-merkezi/giris" class="btn btn-sm btn-block" style="margin-top:8px;">Çıkış Yap</a>
    </div>
  </aside>

  <main class="panel-main">
    <div class="panel-topbar">
      <button class="panel-menu-toggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div>
        <h1>Ürünlerim</h1>
        <p id="urunler-subtitle">Yükleniyor…</p>
      </div>
      <div class="panel-actions">
        <a href="/satici-merkezi/panel/urun-ekle" class="btn btn-solid btn-sm">+ Yeni Ürün</a>
      </div>
    </div>

    <div class="panel-card">
      <div class="panel-card-head">
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <input type="text" id="urun-ara" placeholder="Ürün ara..." style="background:var(--bg); border:1px solid var(--gold-line-strong); color:var(--ivory); padding:9px 14px; border-radius:var(--radius); font-size:13px; width:220px;">
          <select id="urun-kategori-filtre" style="background:var(--bg); border:1px solid var(--gold-line-strong); color:var(--ivory-dim); padding:9px 14px; border-radius:var(--radius); font-size:13px;">
            <option value="">Tüm Kategoriler</option>
            <option>Tesbih</option>
            <option>Yüzük</option>
          </select>
        </div>
        <span class="muted" style="font-size:12.5px;" id="urunler-count"></span>
      </div>
      <table class="p-table">
        <thead><tr><th>Ürün</th><th>Kategori</th><th>Fiyat</th><th>Stok</th><th>Durum</th><th></th></tr></thead>
        <tbody id="urunler-tbody">
          <tr><td colspan="6" class="muted">Yükleniyor…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/supabase-client.js"></script>
<script src="../../assets/js/seller-guard.js"></script>
<script src="../../assets/js/main.js"></script>
<script src="../../assets/js/panel.js"></script>
<script>
  let allProducts = [];

  function statusPill(p) {
    if (p.status === 'draft') return '<span class="status-pill info">Taslak</span>';
    if (p.stock <= 0) return '<span class="status-pill warn">Tükendi</span>';
    if (p.stock <= 5) return '<span class="status-pill wait">Az Stok</span>';
    return '<span class="status-pill ok">Yayında</span>';
  }

  function renderProducts() {
    const q = document.getElementById('urun-ara').value.trim().toLocaleLowerCase('tr');
    const cat = document.getElementById('urun-kategori-filtre').value;
    const filtered = allProducts.filter(p => {
      if (cat && p.category !== cat) return false;
      if (q && !p.name.toLocaleLowerCase('tr').includes(q)) return false;
      return true;
    });
    document.getElementById('urunler-subtitle').textContent = `Mağazanızdaki ${allProducts.length} ürünü buradan yönetin.`;
    document.getElementById('urunler-count').textContent = `${allProducts.length} üründen ${filtered.length}'i gösteriliyor`;
    const tbody = document.getElementById('urunler-tbody');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="muted">Ürün bulunamadı.</td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(p => {
      const img = p.image_url || (p.category === 'Yüzük' ? '../../assets/img/illus-yuzuk.svg' : '../../assets/img/illus-tesbih.svg');
      return `
        <tr>
          <td><div class="p-cell-main"><div class="p-thumb"><img src="${IMAME.escapeHtml(img)}" style="width:60%;"></div><div><strong>${IMAME.escapeHtml(p.name)}</strong><small>${IMAME.formatTL(p.price)}</small></div></div></td>
          <td>${IMAME.escapeHtml(p.category)}</td>
          <td>${IMAME.formatTL(p.price)}</td>
          <td>${p.stock}</td>
          <td>${statusPill(p)}</td>
          <td style="display:flex; gap:12px;">
            <a class="row-action" href="/satici-merkezi/panel/urun-ekle?id=${p.id}">Düzenle</a>
            <span class="row-action" data-delete="${p.id}" style="color:var(--oxblood-bright);">Sil</span>
          </td>
        </tr>`;
    }).join('');
    tbody.querySelectorAll('[data-delete]').forEach(el => el.addEventListener('click', async () => {
      if (!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;
      try {
        await DB.deleteProduct(el.dataset.delete);
        allProducts = allProducts.filter(p => p.id !== el.dataset.delete);
        renderProducts();
        IMAME.toast('Ürün silindi.');
      } catch (err) {
        IMAME.toast('Silinemedi: ' + (err.message || 'bilinmeyen hata.'));
      }
    }));
  }

  window.addEventListener('tesbihyol:seller-ready', async () => {
    try {
      allProducts = await DB.fetchMyProducts();
      renderProducts();
    } catch (err) {
      console.error('[TesbihYol] Ürünler yüklenemedi:', err);
      document.getElementById('urunler-tbody').innerHTML = '<tr><td colspan="6" class="muted">Ürünler yüklenirken bir sorun oluştu.</td></tr>';
    }
  });

  document.getElementById('urun-ara').addEventListener('input', renderProducts);
  document.getElementById('urun-kategori-filtre').addEventListener('change', renderProducts);
</script>
</body>
</html>
