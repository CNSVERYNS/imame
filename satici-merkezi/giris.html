<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satıcı Girişi — Danedane Satıcı Merkezi</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0b0d09">
<link rel="manifest" href="../assets/manifest.json">
<link rel="apple-touch-icon" href="../assets/img/logo-mark.svg">
<link rel="icon" href="../assets/img/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/panel.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="../assets/img/logo-mark.svg" alt="Danedane">
      <span>
        <span class="brand-name">DANE<em>DANE</em></span>
        <span class="brand-sub" style="color:var(--panel-accent-bright);">Satıcı Merkezi</span>
      </span>
    </a>
    <nav class="main-nav"></nav>
    <div class="header-actions">
      <a href="index.html" class="btn btn-ghost btn-sm">← Satıcı Merkezine Dön</a>
    </div>
  </div>
</header>

<section class="section section--pattern">
  <div class="container auth-wrap">
    <div class="center" style="margin-bottom:34px;">
      <img src="../assets/img/logo-mark.svg" style="width:40px; margin:0 auto 16px;">
      <h1 style="font-size:28px;">Satıcı Girişi</h1>
      <p class="muted" style="font-size:13.5px; margin-top:8px;">Panelinize giriş yaparak ürün ve siparişlerinizi yönetin.</p>
    </div>

    <div class="auth-card">
      <form id="seller-login">
        <div class="field"><label>E-posta</label><input type="email" required placeholder="ornek@eposta.com" value="ahmet@konyaelsanatlari.com"></div>
        <div class="field"><label>Şifre</label><input type="password" required placeholder="••••••••" value="demo1234"></div>
        <div class="auth-alt-row">
          <label class="checkbox-row" style="align-items:center;"><input type="checkbox"> Beni hatırla</label>
          <a href="#">Şifremi unuttum</a>
        </div>
        <button type="submit" class="btn btn-solid btn-block">Panele Giriş Yap</button>
      </form>
      <div class="auth-divider">veya</div>
      <p class="center muted" style="font-size:12.5px;">Henüz satıcı değil misiniz? <a href="basvuru.html" style="color:var(--panel-accent-bright);">Hemen başvurun →</a></p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none; padding-top:30px;">
      <span>© 2026 Danedane Satıcı Merkezi. Tüm hakları saklıdır.</span>
    </div>
  </div>
</footer>

<script src="../assets/js/main.js"></script>
<script>
  document.getElementById('seller-login').addEventListener('submit', (e) => {
    e.preventDefault();
    window.location.href = 'panel/index.html';
  });
</script>
</body>
</html>
